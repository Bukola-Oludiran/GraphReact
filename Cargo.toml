[workspace]
resolver = "2"
members = [
    "crates/graphreact-linalg",
    "crates/graphreact-core",
    "crates/graphreact-algorithms",
    "crates/graphreact-graspologic",
    "crates/graphreact-grx-parser",
    "crates/graphreact-engine-zig",
    "crates/graphreact-engine-null",
    "crates/graphreact-engine-echo",
    "crates/graphreact-engine-jsc",
    "crates/graphreact-engine-cpython",
    "crates/graphreact-engine-go",
    "crates/graphreact-codegen-go",
    "crates/graphreact-dist",
    "crates/graphreact-hotreload",
    "crates/graphreact-observer",
    "crates/graphreact-secrets",
    "crates/graphreact-persistence",
    "crates/graphreact-cli",
    "crates/graphreact-napi",
    "crates/graphreact-wasm",
    "crates/graphreact-lsp",
    "tree-sitter-grx",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["GraphReact Contributors"]
repository = "https://github.com/graphreact/graphreact"
rust-version = "1.83"

[workspace.dependencies]
faer = "=0.20"
generational-box = "0.7"
slotmap = "1.0"
parking_lot = "0.12"
arc-swap = "1"
itoa = "1"
indexmap = "2"
smallvec = "1.13"
ahash = "0.8"
rustc-hash = "2"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
notify = "8"
napi = { version = "2.16", features = ["napi8", "tokio_rt"] }
napi-derive = "2.16"
napi-build = "2"
wasm-bindgen = "0.2"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
criterion = { version = "0.5", default-features = false, features = ["plotters", "cargo_bench_support"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
cc = "1"

# M-Ingress phase 2 — server-side correlation_id mint for
# `POST /v1/nodes/:id/call`. UUIDv4 keeps the space wide enough that
# accidental reuse is ~impossible.
uuid = { version = "1", features = ["v4", "v7"] }

# M15 Phase 1B — tree-sitter incremental reparse for `.grx` parser.
tree-sitter = "0.25"
tree-sitter-language = "0.1"

# **M-Prod sub-track #1 Phase B Part 2 (Group 1c).** JWT validation
# substrate for the OIDC bridge. MIT-licensed; transitive deps are
# ring (already vendored via rustls), serde / serde_json (already
# workspace), base64 0.22 (already in-tree via rustls 0.23), pem 3
# / simple_asn1 (ISC — both already on the cargo-deny allowlist).
# Pinned at the v9 major (NOT v10) because v10 hasn't been audited
# against our existing pem 3 / base64 0.22 / serde lock baseline.
# ADR-0010 documents the upgrade rationale + landmines.
jsonwebtoken = "9"

# M14 — distribution layer (graphreact-dist).
postcard = { version = "1", features = ["use-std"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
hmac = "0.12"
sha2 = "0.10"
zeroize = { version = "1", features = ["zeroize_derive"] }
subtle = "2"
dashmap = "6"

# M17 phase 1 — Go runtime engine. libloading dlopens the c-shared
# artifact produced by `grx build` (`go build -buildmode=c-shared`)
# and looks up the GrxXxx exported symbols. (sha2 was already in
# workspace deps for M14 — codegen-go's BuildArtifact.library_sha256_hex
# reuses that workspace pin.)
libloading = "0.8"
rcgen = "0.13"  # dev-only — self-signed certs for transport tests

# M16-Backend P2 — observer HTTP server (Prometheus exporter + healthz).
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto"] }
http-body-util = "0.1"
prometheus-parse = "0.2"  # dev-only — validates /metrics text-format output

# M16-Backend P3 — tracing-subscriber Layer for unified JSON logs.
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std", "fmt"] }

# M16-Backend P4 — Management API HTTP framework. axum 0.7 picked on
# evidence (multi-route + auth-state-sharing + cross-thread bridge for
# !Send Scheduler) per docs/backend/m16-p4-framework-decision.md.
# P7 added the `ws` feature for WebSocket upgrade on /v1/observer/events.
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio", "matched-path", "query", "ws"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["trace", "cors"] }

# M16-Backend P7 — WebSocket client (tokio-tungstenite) for the CLI's
# `grx observer` ws_client; pairs with the axum `ws` feature on the
# daemon side. rustls integration via tokio-tungstenite's
# rustls-tls-native-roots feature so the same TLS path covers WSS.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-native-roots", "handshake"] }

# M16-Backend P6 — `grx observer` ratatui terminal UI + first cross-host
# scrape consumer. ratatui is sync; the polling loop is async via tokio
# and updates state via `tokio::sync::watch`; the render loop reads the
# latest snapshot per frame. crossterm's `event-stream` feature surfaces
# input as a tokio Stream so we can `tokio::select!` it with the watch
# channel. rustls-native-certs pulls the system trust store for the new
# `tokio_rustls::TlsConnector` path in `observer_client::get`.
ratatui = "0.28"
crossterm = { version = "0.28", features = ["event-stream"] }
rustls-native-certs = "0.8"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
similar_names = "allow"
doc_markdown = "allow"
float_cmp = "allow"
type_complexity = "allow"
too_many_lines = "allow"
needless_pass_by_value = "allow"
manual_let_else = "allow"
manual_map = "allow"
map_unwrap_or = "allow"
missing_fields_in_debug = "allow"
single_match_else = "allow"
unused_self = "allow"
needless_continue = "allow"
redundant_else = "allow"
no_effect_underscore_binding = "allow"
used_underscore_binding = "allow"
uninlined_format_args = "allow"
default_trait_access = "allow"
unchecked_time_subtraction = "allow"
doc_overindented_list_items = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.release-small]
inherits = "release"
opt-level = "s"
strip = "symbols"

[profile.bench]
debug = true
