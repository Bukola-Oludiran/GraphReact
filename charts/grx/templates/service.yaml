apiVersion: v1
kind: Service
metadata:
  name: {{ include "grx.fullname" . }}
  labels:
    {{- include "grx.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: observer
      protocol: TCP
      name: observer
  selector:
    {{- include "grx.selectorLabels" . | nindent 4 }}
