apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "grx.fullname" . }}
  labels:
    {{- include "grx.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "grx.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the deployment when the ConfigMap changes (otherwise
        # pods stale-mount the old runtime.args / audit log path).
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "grx.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "grx.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}

      # Drain budget math (m-prod-lifecycle.md):
      #   drainDeadlineSecs + observerShutdownDeadline + slack
      #     = `terminationGracePeriodSeconds`
      # The default 30s == 20 (drain) + 5 (OTel) + 5 (slack).
      terminationGracePeriodSeconds: {{ .Values.lifecycle.terminationGracePeriodSeconds }}

      containers:
        - name: grx
          image: {{ include "grx.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}

          # `grx cluster daemon` is the production server entrypoint.
          # The Dockerfile defaults to `grx --help`; helm overrides
          # explicitly here so the operator-visible command surface is
          # in YAML, not buried in the image.
          args:
            - "cluster"
            - "daemon"
            - "--observer-bind"
            - {{ .Values.observer.bind | quote }}
            - "--drain-deadline-secs"
            - "{{ .Values.lifecycle.drainDeadlineSecs }}"
            {{- if ne .Values.runtime.kind "mixed" }}
            - "--engine"
            - {{ .Values.runtime.kind | quote }}
            {{- end }}
            {{- with .Values.runtime.args }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

          env:
            # Mirror the CLI flag into the env var that
            # `commands.rs::resolve_drain_deadline()` reads when the
            # CLI flag is not explicitly set. Belt-and-suspenders so a
            # future args override doesn't silently drop the budget.
            - name: GRX_DRAIN_DEADLINE_SECS
              value: "{{ .Values.lifecycle.drainDeadlineSecs }}"
            - name: OBSERVER_SHUTDOWN_DEADLINE
              value: "{{ .Values.lifecycle.observerShutdownDeadline }}"
            {{- if .Values.observer.token.existingSecret }}
            - name: GRX_OBSERVER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.observer.token.existingSecret | quote }}
                  key: {{ .Values.observer.token.key | quote }}
            {{- end }}
            {{- if .Values.observer.audit.logPath }}
            - name: GRX_AUDIT_LOG_PATH
              value: {{ .Values.observer.audit.logPath | quote }}
            {{- end }}

          ports:
            - name: observer
              containerPort: {{ .Values.service.port }}
              protocol: TCP

          # Distinct readiness vs liveness probes per
          # m-prod-observability.md. /v1/healthz = liveness;
          # /v1/readyz = readiness (drain-aware, returns 503 `draining`
          # during SIGTERM).
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: observer
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: observer
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          volumeMounts:
            # readOnlyRootFilesystem: true (containerSecurityContext)
            # requires explicit writable mounts for anything grx writes:
            #   - /tmp           — cargo target, scratch, lock files
            #   - /home/nonroot  — distroless `nonroot` UID 65532 home,
            #                      grx caches ~/.grx
            - name: tmp
              mountPath: /tmp
            - name: grx-home
              mountPath: /home/nonroot
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

      volumes:
        - name: tmp
          emptyDir: {}
        - name: grx-home
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
