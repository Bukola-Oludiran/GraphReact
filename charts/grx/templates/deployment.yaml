apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "grx.fullname" . }}
  labels:
    {{- include "grx.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "grx.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the deployment when the ConfigMap changes (otherwise
        # pods stale-mount the old runtime.args / audit log path).
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "grx.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "grx.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}

      # Drain budget math (m-prod-lifecycle.md):
      #   drainDeadlineSecs + observerShutdownDeadline + slack
      #     = `terminationGracePeriodSeconds`
      # The default 30s == 20 (drain) + 5 (OTel) + 5 (slack).
      terminationGracePeriodSeconds: {{ .Values.lifecycle.terminationGracePeriodSeconds }}

      containers:
        - name: grx
          image: {{ include "grx.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}

          # `grx run` is the single-node entrypoint shipped by this
          # chart in Phase A. Production multi-node `grx cluster
          # daemon` requires operator-supplied node-id + listen + TLS
          # cert/key/CA + cookie material — those secrets live outside
          # what a chart can sensibly default; a cluster-mode preset
          # ships in Phase B (charts/grx/values-cluster.yaml).
          #
          # The `--runtime` flag name matches the CLI (cli.rs:430);
          # values.runtime.kind picks one of null/echo/jsc/cpython/go.
          # The script path is mandatory positional for `grx run`.
          args:
            - "run"
            - {{ .Values.runtime.scriptPath | quote }}
            - "--runtime"
            - {{ .Values.runtime.kind | quote }}
            {{- if .Values.observer.bind }}
            - "--observer-bind"
            - {{ .Values.observer.bind | quote }}
            {{- end }}
            {{- if .Values.observer.token.existingSecret }}
            # --observer-token-env points clap at the env var name the
            # binary should read; the env var itself is wired below
            # via secretKeyRef so the token never appears in `ps`.
            - "--observer-token-env"
            - "GRX_OBSERVER_TOKEN"
            {{- end }}
            {{- if .Values.observer.audit.logPath }}
            # --observer-audit-log opens a FileAuditSink (mode 0o600
            # enforced by the binary, see m-prod-auth.md). The path
            # must live on a writable mount; values.audit.volume
            # provisions an emptyDir or PVC at the path's parent.
            - "--observer-audit-log"
            - {{ .Values.observer.audit.logPath | quote }}
            {{- end }}
            {{- with .Values.runtime.args }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

          env:
            # Mirror the drain-deadline CLI flag into the env var the
            # binary reads when --drain-deadline-secs is not set
            # (commands.rs::resolve_drain_deadline). Belt-and-
            # suspenders so a future args override doesn't silently
            # drop the budget.
            - name: GRX_DRAIN_DEADLINE_SECS
              value: "{{ .Values.lifecycle.drainDeadlineSecs }}"
            - name: OBSERVER_SHUTDOWN_DEADLINE
              value: "{{ .Values.lifecycle.observerShutdownDeadline }}"
            {{- if .Values.observer.token.existingSecret }}
            # Token-from-secret pattern: chart projects the secret
            # value into GRX_OBSERVER_TOKEN, and --observer-token-env
            # (set above) tells the binary to read that name. The
            # binary's auth substrate (auth.rs::BearerToken::from_env)
            # zeroizes the value on drop.
            - name: GRX_OBSERVER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.observer.token.existingSecret | quote }}
                  key: {{ .Values.observer.token.key | quote }}
            {{- end }}

          ports:
            - name: observer
              containerPort: {{ .Values.service.port }}
              protocol: TCP

          # Distinct readiness vs liveness probes per
          # m-prod-observability.md. /v1/healthz = liveness;
          # /v1/readyz = readiness (drain-aware, returns 503 `draining`
          # during SIGTERM).
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: observer
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: observer
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          volumeMounts:
            # readOnlyRootFilesystem: true (containerSecurityContext)
            # requires explicit writable mounts for anything grx writes:
            #   - /tmp           — cargo target, scratch, lock files
            #   - /home/nonroot  — distroless `nonroot` UID 65532 home,
            #                      grx caches ~/.grx
            - name: tmp
              mountPath: /tmp
            - name: grx-home
              mountPath: /home/nonroot
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

      volumes:
        - name: tmp
          emptyDir: {}
        - name: grx-home
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
