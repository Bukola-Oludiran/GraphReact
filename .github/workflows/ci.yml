name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Note: this workflow uses only safe GitHub Actions contexts (matrix.*, secrets via
# action env, no untrusted user-controlled inputs flow into shell commands).
# See https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # M14.8.x-followon (Phase I) — per-OS × per-Python-minor matrix.
        # Closes the M13-phase3h "no automated CI matrix" deferral.
        # Windows is intentionally excluded today: pkg-config probe
        # works in theory per build.rs but isn't verified end-to-end.
        # 3.14t (free-threaded, PEP 703) is excluded until
        # actions/setup-python ships free-threaded support — track
        # follow-on once available.
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13", "3.14"]
    env:
      # Matrix values are workflow-defined (not from untrusted
      # event payloads); piping them through env keeps the
      # downstream `run:` block free of `${{ … }}` interpolation.
      MATRIX_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: Swatinem/rust-cache@v2
        with:
          # Bust the cache between Python minors so each cell
          # rebuilds the cpython engine against the right ABI.
          key: py${{ matrix.python }}
      - name: Resolve Python pkg-config name
        # The cpython build.rs probes pkg-config in descending
        # version order; we set GRAPHREACT_PYTHON_PKGCONFIG to
        # pin THIS matrix cell's Python minor.
        run: |
          echo "GRAPHREACT_PYTHON_PKGCONFIG=python-${MATRIX_PYTHON}-embed" >> "$GITHUB_ENV"
          echo "GRAPHREACT_PYTHON_VERSION=${MATRIX_PYTHON}" >> "$GITHUB_ENV"
      - run: cargo test --workspace --all-features

  cluster-persistence:
    name: cluster-persistence (Postgres / MinIO)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: graphreact
          POSTGRES_USER: graphreact
          POSTGRES_PASSWORD: graphreact-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U graphreact -d graphreact"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      GRX_CLUSTER_TEST_DATABASE_URL: postgres://graphreact:graphreact-test@127.0.0.1:5432/graphreact?sslmode=disable
      GRX_CLUSTER_TEST_S3_BUCKET: graphreact-persistence
      GRX_CLUSTER_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      GRX_CLUSTER_TEST_S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: graphreact
      AWS_SECRET_ACCESS_KEY: graphreact-test-secret
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          key: cluster-persistence
      - name: Resolve Python pkg-config name
        run: |
          echo "GRAPHREACT_PYTHON_PKGCONFIG=python-3.12-embed" >> "$GITHUB_ENV"
          echo "GRAPHREACT_PYTHON_VERSION=3.12" >> "$GITHUB_ENV"
      - name: Start MinIO
        run: |
          docker run --detach --name grx-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER="$AWS_ACCESS_KEY_ID" \
            --env MINIO_ROOT_PASSWORD="$AWS_SECRET_ACCESS_KEY" \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs grx-minio
          exit 1
      - name: Create test bucket
        run: |
          docker run --rm --network host --entrypoint /bin/sh \
            minio/mc:RELEASE.2025-08-13T08-35-41Z -c \
            'mc alias set local http://127.0.0.1:9000 graphreact graphreact-test-secret && mc mb --ignore-existing local/graphreact-persistence'
      - name: Postgres and MinIO conformance
        run: cargo test -p graphreact-persistence --test cluster_services -- --ignored --nocapture
      - name: Repeated daemon failover
        run: cargo test -p graphreact-cli --test cluster_failover_services -- --ignored --nocapture

  test-go:
    name: test-go (${{ matrix.os }} / go${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # M17 phase 3h — per-OS × per-Go-minor matrix.
        # Closes the M17 phase 3h "CI matrix green on Linux/macOS ×
        # Go 1.22/1.23/1.24" deliverable.
        #
        # Go minors are upstream-supported for the two latest at a
        # time (current: 1.25/1.26). We hold one EOL minor (1.24) as
        # an ecosystem signal so an artifact deployed to a stale
        # toolchain still surfaces breakage.
        #
        # Windows is intentionally excluded today: the existing test
        # job already excludes Windows for Python; cgo + Go's c-shared
        # buildmode on Windows works in theory but isn't verified
        # end-to-end. Track follow-on once a Windows test cell is
        # available for both engines.
        os: [ubuntu-latest, macos-latest]
        go: ["1.24", "1.25", "1.26"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - uses: actions/setup-python@v5
        with:
          # Pin a default Python so graphreact-engine-cpython's
          # build.rs probe succeeds — every Go matrix cell needs a
          # working CPython embed since `cargo test --workspace`
          # builds the cpython engine too. Doesn't matrix across
          # Python — that's the `test` job's responsibility.
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          # Bust the cache between Go minors so each cell rebuilds
          # the engine-go test stub against the right Go runtime.
          key: go${{ matrix.go }}
      - name: Resolve Python pkg-config name
        run: |
          echo "GRAPHREACT_PYTHON_PKGCONFIG=python-3.12-embed" >> "$GITHUB_ENV"
          echo "GRAPHREACT_PYTHON_VERSION=3.12" >> "$GITHUB_ENV"
      - name: Workspace tests (debug)
        # Runs all 20 goruntime smoke scenarios + engine-go
        # conformance_smoke + the 100×1k stress test (debug
        # allocator slows it ~5× vs release but still under the
        # 60s test budget on the GitHub runners).
        run: cargo test --workspace --all-features
      - name: Stress test (release)
        # Belt-and-suspenders: re-run the 100×1k stress test in
        # release mode for production-speed signal. The synthesis
        # behind M17 phase 3f specifies release as the canonical
        # measurement profile — surfacing a contention regression
        # at production performance is the explicit acceptance.
        run: cargo test -p graphreact-engine-go --release --test stress_100x1k -- --nocapture

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  sbom:
    # **M-Prod sub-track #7 (supply chain) safest slice.** Emits a
    # CycloneDX JSON SBOM of the workspace dependency tree on every
    # push to main AND on every release tag. Artifact retention is
    # 90 days (GitHub default); release-tag runs additionally upload
    # to the GitHub Release (added once the M-Prod #8 release
    # pipeline lands — sub-track #7 v1 ships the SBOM as a CI
    # artifact only).
    #
    # cargo-cyclonedx is installed via `cargo install` rather than
    # added to workspace dev-dependencies because (a) it is a CI
    # tool, not a runtime / test dependency, (b) keeping it out of
    # workspace deps means deny.toml's license allowlist need not
    # be updated for the cyclonedx transitive closure (the tool
    # only runs in CI), and (c) future Sigstore-keyless signing
    # (sub-track #7 v2) will sign the artifact path here without
    # mutating any source-level Cargo manifest.
    name: cyclonedx-sbom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Cache key separate from the test / clippy jobs so
          # the SBOM run doesn't bust their caches and vice versa.
          key: sbom
      - name: Install cargo-cyclonedx
        # Prebuilt binary install via taiki-e/install-action keeps
        # the SBOM step under the <1min budget per cargo-cyclonedx
        # release. Pin via tool: spec so a future version bump is
        # an explicit PR change, not a tracking-latest drift.
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx@0.5.9
      - name: Generate CycloneDX SBOM (JSON, spec-version 1.4)
        # `--format json --spec-version 1.4` pins the emitted
        # schema to CycloneDX 1.4. cargo-cyclonedx 0.5.x defaults
        # to spec version 1.3 if no flag is given, which would
        # silently break the supply-chain contract documented in
        # docs/backend/m-prod-supply-chain.md (Grype/Trivy/Dep-Track
        # consumers wired to 1.4 would fail-quiet on a 1.3 file).
        # `--all` walks every workspace member so the SBOM is a
        # single tree describing the full `grx` artifact's
        # dependency closure (matters because per-engine slices
        # ship per-crate binaries).
        run: cargo cyclonedx --format json --spec-version 1.4 --all
      - name: Collect SBOM artifacts
        # cargo-cyclonedx writes one `<crate>.cdx.json` per
        # workspace member next to its Cargo.toml. Gather them
        # all under a single `sbom/` directory so the upload
        # step ships them as one bundle.
        run: |
          mkdir -p sbom
          find . -name '*.cdx.json' -not -path './sbom/*' -exec cp {} sbom/ \;
          ls -la sbom/
      - name: Validate emitted CycloneDX JSON
        # Belt-and-suspenders check against silent regressions in
        # cargo-cyclonedx: every emitted file must be valid JSON,
        # carry bomFormat == "CycloneDX", and report specVersion
        # 1.4 (matches the --spec-version flag above). Catches a
        # tool regression that the upload-artifact step otherwise
        # cannot detect (it only checks file existence).
        run: |
          set -euo pipefail
          fail=0
          for f in sbom/*.cdx.json; do
            jq -e '.bomFormat == "CycloneDX" and .specVersion == "1.4"' "$f" >/dev/null \
              || { echo "::error file=$f::not a CycloneDX 1.4 JSON document"; fail=1; }
          done
          [ "$fail" -eq 0 ]
      - uses: actions/upload-artifact@v4
        with:
          # Tag runs ship under the tag name (e.g. sbom-cyclonedx-v0.1.0)
          # so per-tag artifacts are stable + dereferenceable. Push-to-main
          # falls back to the commit SHA.
          name: sbom-cyclonedx-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          path: sbom/
          retention-days: 90
          if-no-files-found: error

  fuzz:
    # **M-Prod sub-track #9 (chaos + fuzz) safest slice.** Runs the
    # `fuzz_management_api_bodies` libFuzzer target against the three
    # ingress JSON body shapes (`InjectMessageBody`, `CallMessageBody`,
    # `BulkLineBody`). Kill-gate: any panic / ASan trap / libFuzzer-
    # detected timeout fails the job — successful deserialisations
    # (and well-formed serde_json::Err) pass silently.
    #
    # Push-to-main + release tags only (NOT PRs): a 10-min libFuzzer
    # run + ~2-3 min cargo-fuzz cold-build is too heavy for PR
    # turnaround. The `if` guard at the job level scopes it without
    # touching the workflow-level `on:` block (which would gate fmt /
    # clippy / test / deny / sbom too).
    name: fuzz-management-api-bodies
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly toolchain
        # cargo-fuzz requires nightly Rust (uses `-Z sanitizer=address`
        # + private libFuzzer compiler intrinsics). Pinning a specific
        # nightly date keeps a bad nightly from reddening this lane on
        # an unrelated push; bump via deliberate PR.
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-06-01
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          # Cache key separate from test / clippy / sbom so the fuzz
          # build's nightly + ASan-instrumented target cache doesn't
          # bust the stable build caches.
          key: fuzz
          workspaces: |
            .
            fuzz
      - name: Install cargo-fuzz
        # Prebuilt-binary install via taiki-e/install-action keeps
        # the cold-build cost down (consistent with the SBOM cell's
        # cargo-cyclonedx install). Pin the version explicitly so a
        # cargo-fuzz upstream regression surfaces as a PR review, not
        # a silent CI drift.
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz@0.12
      - name: Build fuzz target (sanity)
        # Build-only step proves the fuzz substrate compiles before
        # we burn the 10-min runtime budget on a misconfiguration.
        # Failure here surfaces as a clear "fuzz substrate broken"
        # signal rather than a vague libFuzzer error.
        working-directory: fuzz
        run: cargo +nightly-2026-06-01 fuzz build fuzz_management_api_bodies
      - name: Run fuzz target (10 min)
        # `-max_total_time=600` is libFuzzer's wall-clock cap in
        # seconds. The flag is a soft cap: in-flight inputs finish,
        # so the actual runtime is 600-650s. ASan is on by default
        # (cargo-fuzz default); `-rss_limit_mb=2048` caps the
        # per-iteration memory budget so an unbounded-allocation
        # bug fails fast instead of OOMing the runner.
        working-directory: fuzz
        run: |
          set -euo pipefail
          cargo +nightly-2026-06-01 fuzz run fuzz_management_api_bodies -- \
            -max_total_time=600 \
            -rss_limit_mb=2048 \
            -print_final_stats=1
      - name: Upload fuzz artifacts (failure inputs + final corpus)
        # `actions/upload-artifact` ships any crash inputs libFuzzer
        # found under `fuzz/artifacts/` plus the corpus directory
        # for downstream replay. Only fires on failure — successful
        # runs don't surface their corpus growth into the artifact
        # store yet (that's tracked under the 24h cumulative-corpus
        # CI cell, which is a CI-infra-track follow-on).
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-management-api-bodies-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          path: |
            fuzz/artifacts/
            fuzz/corpus/
          retention-days: 14
          if-no-files-found: warn

  reproducible-build:
    # **M-Prod sub-track #7 residual — reproducible-build verifier.**
    # Twice-builds the `grx` release binary on a single runner and
    # compares the SHA-256 hashes. The contract under proof: given a
    # pinned toolchain (dtolnay/rust-toolchain@stable, same SHA across
    # both builds in one job), pinned zig static libs (frozen between
    # the two builds; produced once via `cargo xtask zig-build`), a
    # pinned `SOURCE_DATE_EPOCH` (HEAD's committer timestamp), and
    # `--remap-path-prefix` RUSTFLAGS to strip host-specific paths
    # from debuginfo — the `grx` binary should rebuild byte-identical.
    #
    # Push-to-main + tag only (matches the fuzz cell guard at line 245):
    # the twice-build costs ~6-8 min and we don't want every PR to
    # pay that. `continue-on-error: true` is the first-ship posture —
    # current Phase A may still drift due to absolute LC_RPATH paths
    # emitted by `crates/graphreact-cli/build.rs` (Homebrew libpython
    # libdir is host-specific). The flip-to-hard-gate trigger:
    # documented in `docs/backend/m-prod-supply-chain.md`.
    #
    # Scope: ONLY the Rust binary is twice-built. The zig static libs
    # (`libgraphreact_*_zig.a`) are produced ONCE and frozen between
    # the two runs — `cargo xtask zig-build` does not (yet) thread
    # SOURCE_DATE_EPOCH / --remap-path-prefix through to `zig build`,
    # so any byte-diff in the .a files would falsely fail this gate.
    # Phase B (when the zig-build lane adopts the same env vars) can
    # flip to a full twice-build including zig.
    name: reproducible-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install zig (for one-shot bridge build)
        # zig is needed to produce the static .a files that the engine
        # build.rs's link against; we build them ONCE and freeze them
        # between the two Rust builds.
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: Swatinem/rust-cache@v2
        with:
          # Distinct cache key from sbom / fuzz / clippy so the
          # repro build's stripped + path-remapped target dir doesn't
          # contaminate the other lanes (different RUSTFLAGS = cache
          # divergence anyway, but explicit is better).
          key: repro-1
      - name: Compute SOURCE_DATE_EPOCH from HEAD committer timestamp
        # Pinning SOURCE_DATE_EPOCH to HEAD's committer timestamp gives
        # every build of the same SHA an identical epoch — bytes-of-the-
        # output-depend-only-on-the-source-tree, which is the
        # reproducible-build floor. Surfaced via $GITHUB_ENV so both
        # build steps see the same value.
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      - name: Build zig bridge static libs (frozen between builds)
        # One-shot — neither twice-build pass re-runs this. The .a
        # files in zig/bridge/zig-out/lib/ are byte-identical inputs
        # to both Rust builds, so any difference in the final `grx`
        # binary is attributable to the Rust build alone.
        run: cargo xtask zig-build --release
      - name: First build (capture sha256)
        # --remap-path-prefix strips the workspace + cargo home from
        # debuginfo so the runner's homedir doesn't leak into the
        # binary. SOURCE_DATE_EPOCH was set above.
        env:
          # Override the default `RUSTFLAGS: -D warnings` from the
          # workflow env: this lane needs path-remapping, and `-D
          # warnings` would already have been caught by the clippy
          # lane.
          RUSTFLAGS: "--remap-path-prefix=${{ github.workspace }}=. --remap-path-prefix=${{ env.HOME }}/.cargo=/cargo"
        run: |
          set -euo pipefail
          cargo build --release --bin grx
          sha256sum target/release/grx | tee /tmp/grx-sha256-1.txt
          cp target/release/grx /tmp/grx-build-1
      - name: Wipe the Rust target dir between builds
        # Force the second build to recompile everything from scratch.
        # The Swatinem cache still hydrates the registry + git checkouts
        # (which are content-addressed and so don't affect byte output),
        # but `target/release/grx` itself MUST be re-emitted from source
        # for the comparison to be meaningful. `cargo clean -p
        # graphreact-cli` only purges that crate's artifacts; we want a
        # full target wipe to also re-link.
        run: |
          set -euo pipefail
          rm -rf target/release/grx target/release/deps/grx-*
          # Don't touch zig/bridge/zig-out/ — those .a files are the
          # frozen inputs.
      - name: Second build (capture sha256)
        env:
          RUSTFLAGS: "--remap-path-prefix=${{ github.workspace }}=. --remap-path-prefix=${{ env.HOME }}/.cargo=/cargo"
        run: |
          set -euo pipefail
          cargo build --release --bin grx
          sha256sum target/release/grx | tee /tmp/grx-sha256-2.txt
          cp target/release/grx /tmp/grx-build-2
      - name: Compare twice-build SHAs
        # Diff the two hashes. Phase A continues on error if they
        # diverge (LC_RPATH absolute libpython path, .a files still
        # carry build-time host data, etc.). Phase B flips this to a
        # hard gate once the known divergence sources are closed.
        run: |
          set -euo pipefail
          h1=$(awk '{print $1}' /tmp/grx-sha256-1.txt)
          h2=$(awk '{print $1}' /tmp/grx-sha256-2.txt)
          echo "build-1 sha256: $h1"
          echo "build-2 sha256: $h2"
          if [ "$h1" = "$h2" ]; then
            echo "REPRODUCIBLE: $h1"
          else
            echo "::warning::Build is NOT yet reproducible (h1=$h1 h2=$h2). \
              continue-on-error: true is in effect; see \
              docs/backend/m-prod-supply-chain.md for Phase B flip-to-hard-gate trigger."
            # Surface a non-zero exit so `continue-on-error: true` marks
            # the job as failed-but-non-blocking; without this the job
            # would pass green and operators would miss the regression.
            exit 1
          fi
      - name: Upload twice-build SHA records (for audit)
        # Always upload so even a divergence surfaces both hashes to
        # the workflow artifact store. Operators can grab them via
        # `gh run download` to audit which bytes drifted.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproducible-build-sha256-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          path: |
            /tmp/grx-sha256-1.txt
            /tmp/grx-sha256-2.txt
          retention-days: 90
          if-no-files-found: warn

  trivy-sbom-scan:
    # **M-Prod sub-track #7 residual — Trivy SARIF scan of the CycloneDX
    # SBOM produced by the `cyclonedx-sbom` job.** Downloads the SBOM
    # artifact, runs Trivy's SBOM-mode scan (severity HIGH+CRITICAL),
    # emits SARIF, and uploads to the GitHub Security tab via
    # codeql-action/upload-sarif.
    #
    # Push-to-main + tag only (matches fuzz + repro). `continue-on-error:
    # true` is the first-ship posture — the trivy DB may surface a flood
    # on first run and we don't want a CVE in a transitive dep to red
    # main while we triage. Flip-to-hard-gate trigger documented in
    # `docs/backend/m-prod-supply-chain.md` (post N stable runs OR after
    # a deny.toml allowlist sweep, whichever comes first).
    #
    # Permissions: `security-events: write` is scoped to THIS job only
    # (not the workflow-level `permissions:` block) so the blast radius
    # of the upload-sarif token stays minimal — every other job runs
    # under the default `permissions: contents: read` posture. Matches
    # the GitHub-Actions-hardening doc-comment at the top of this file
    # (lines 10-12).
    name: trivy-sbom-scan
    runs-on: ubuntu-latest
    needs: sbom
    if: github.event_name == 'push'
    continue-on-error: true
    permissions:
      # security-events: write is required for github/codeql-action/upload-sarif
      # contents: read is required for actions/checkout
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download SBOM artifact from cyclonedx-sbom job
        # The sbom job uploads under `sbom-cyclonedx-<sha-or-tag>`;
        # download via the same expression to keep names aligned.
        # `actions/download-artifact@v4` strictly requires a name match
        # (no glob) so the two `name:` expressions must stay in sync.
        uses: actions/download-artifact@v4
        with:
          name: sbom-cyclonedx-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          path: sbom
      - name: Install Trivy CLI
        # Bypass `aquasecurity/trivy-action` for the per-file loop —
        # the action wraps a single `trivy sbom <file>` invocation, but
        # we emit per-workspace-member CDX files. Pinned 0.53.0 (same
        # release the trivy-action 0.24.0 wraps); bump via deliberate
        # PR. taiki-e/install-action installs the prebuilt binary so
        # cold-start is ~3s vs ~30s for `aquasecurity/trivy-action`'s
        # docker pull.
        uses: taiki-e/install-action@v2
        with:
          tool: trivy@0.53.0
      - name: Scan each CycloneDX SBOM file (per-crate loop)
        # Trivy's `trivy sbom <file>` subcommand takes ONE SBOM at a
        # time and does NOT recurse. The cyclonedx-sbom job emits one
        # `<crate>.cdx.json` per workspace member; iterate them, emit
        # per-crate SARIF, then merge via `jq` into a single SARIF
        # document that codeql-action/upload-sarif can publish.
        #
        # `set -euo pipefail` so a Trivy failure on one file fails the
        # step (caught by job-level `continue-on-error: true` — Phase
        # A is non-gating). `--exit-code 0` per Trivy CLI keeps Trivy
        # from exiting 1 on finding HIGH/CRITICAL — the SARIF upload
        # is the operator-facing signal, not the step exit code.
        run: |
          set -euo pipefail
          mkdir -p trivy-sarif
          shopt -s nullglob
          files=(sbom/*.cdx.json)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::warning::no SBOM files found under sbom/ — nothing to scan"
            # Still emit a minimal valid SARIF so the upload step has a
            # file to consume (otherwise upload-sarif errors).
            printf '%s' '{"version":"2.1.0","runs":[]}' > trivy-results.sarif
            exit 0
          fi
          for f in "${files[@]}"; do
            base="$(basename "$f" .cdx.json)"
            echo "::group::trivy sbom $f"
            trivy sbom "$f" \
              --format sarif \
              --output "trivy-sarif/${base}.sarif" \
              --severity HIGH,CRITICAL \
              --exit-code 0
            echo "::endgroup::"
          done
          # Merge per-crate SARIF runs into one SARIF document. SARIF
          # 2.1.0 allows multiple runs[] entries; codeql-action's
          # upload-sarif accepts the merged document.
          jq -s '
            {
              "version": "2.1.0",
              "$schema": "https://schemastore.azurewebsites.net/schemas/json/sarif-2.1.0-rtm.5.json",
              "runs": (map(.runs[]?))
            }
          ' trivy-sarif/*.sarif > trivy-results.sarif
          echo "Merged $(ls trivy-sarif/ | wc -l) per-crate SARIF runs into trivy-results.sarif"
      - name: Upload SARIF to GitHub Code Scanning
        # codeql-action/upload-sarif publishes the SARIF to the
        # repository's Security tab. Pinned to @v3 (matches
        # actions/checkout@v4 / actions/upload-artifact@v4 pinning
        # style in this workflow).
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          # category tags the results so multiple SARIF uploads from
          # different scanners (Trivy SBOM today; potentially Grype /
          # Snyk later) don't collide in the Security tab.
          category: trivy-sbom-scan
      - name: Upload SARIF as workflow artifact (audit trail)
        # Mirrors the sbom + repro cells: persist the raw SARIF so
        # operators can `gh run download` it without going through the
        # Security tab API.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          path: trivy-results.sarif
          retention-days: 90
          if-no-files-found: warn
