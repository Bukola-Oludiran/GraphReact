name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Note: this workflow uses only safe GitHub Actions contexts (matrix.*, secrets via
# action env, no untrusted user-controlled inputs flow into shell commands).
# See https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # M14.8.x-followon (Phase I) — per-OS × per-Python-minor matrix.
        # Closes the M13-phase3h "no automated CI matrix" deferral.
        # Windows is intentionally excluded today: pkg-config probe
        # works in theory per build.rs but isn't verified end-to-end.
        # 3.14t (free-threaded, PEP 703) is excluded until
        # actions/setup-python ships free-threaded support — track
        # follow-on once available.
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13", "3.14"]
    env:
      # Matrix values are workflow-defined (not from untrusted
      # event payloads); piping them through env keeps the
      # downstream `run:` block free of `${{ … }}` interpolation.
      MATRIX_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: Swatinem/rust-cache@v2
        with:
          # Bust the cache between Python minors so each cell
          # rebuilds the cpython engine against the right ABI.
          key: py${{ matrix.python }}
      - name: Resolve Python pkg-config name
        # The cpython build.rs probes pkg-config in descending
        # version order; we set GRAPHREACT_PYTHON_PKGCONFIG to
        # pin THIS matrix cell's Python minor.
        run: |
          echo "GRAPHREACT_PYTHON_PKGCONFIG=python-${MATRIX_PYTHON}-embed" >> "$GITHUB_ENV"
          echo "GRAPHREACT_PYTHON_VERSION=${MATRIX_PYTHON}" >> "$GITHUB_ENV"
      - run: cargo test --workspace --all-features

  test-go:
    name: test-go (${{ matrix.os }} / go${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # M17 phase 3h — per-OS × per-Go-minor matrix.
        # Closes the M17 phase 3h "CI matrix green on Linux/macOS ×
        # Go 1.22/1.23/1.24" deliverable.
        #
        # Go minors are upstream-supported for the two latest at a
        # time (current: 1.25/1.26). We hold one EOL minor (1.24) as
        # an ecosystem signal so an artifact deployed to a stale
        # toolchain still surfaces breakage.
        #
        # Windows is intentionally excluded today: the existing test
        # job already excludes Windows for Python; cgo + Go's c-shared
        # buildmode on Windows works in theory but isn't verified
        # end-to-end. Track follow-on once a Windows test cell is
        # available for both engines.
        os: [ubuntu-latest, macos-latest]
        go: ["1.24", "1.25", "1.26"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - uses: actions/setup-python@v5
        with:
          # Pin a default Python so graphreact-engine-cpython's
          # build.rs probe succeeds — every Go matrix cell needs a
          # working CPython embed since `cargo test --workspace`
          # builds the cpython engine too. Doesn't matrix across
          # Python — that's the `test` job's responsibility.
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          # Bust the cache between Go minors so each cell rebuilds
          # the engine-go test stub against the right Go runtime.
          key: go${{ matrix.go }}
      - name: Resolve Python pkg-config name
        run: |
          echo "GRAPHREACT_PYTHON_PKGCONFIG=python-3.12-embed" >> "$GITHUB_ENV"
          echo "GRAPHREACT_PYTHON_VERSION=3.12" >> "$GITHUB_ENV"
      - name: Workspace tests (debug)
        # Runs all 20 goruntime smoke scenarios + engine-go
        # conformance_smoke + the 100×1k stress test (debug
        # allocator slows it ~5× vs release but still under the
        # 60s test budget on the GitHub runners).
        run: cargo test --workspace --all-features
      - name: Stress test (release)
        # Belt-and-suspenders: re-run the 100×1k stress test in
        # release mode for production-speed signal. The synthesis
        # behind M17 phase 3f specifies release as the canonical
        # measurement profile — surfacing a contention regression
        # at production performance is the explicit acceptance.
        run: cargo test -p graphreact-engine-go --release --test stress_100x1k -- --nocapture

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources
