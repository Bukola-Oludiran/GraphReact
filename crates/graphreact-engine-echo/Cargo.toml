[package]
name = "graphreact-engine-echo"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Reference engine bridge — validates the Rust↔native FFI surface end-to-end without requiring a real JS engine. Ships with a C implementation (`c/echo.c`) compiled by `build.rs`; a parity Zig implementation lives at `zig/bridge/echo.zig` and the M12.3 JSC work adds a sister `jsc.zig`."
links = "graphreact_echo"

[lib]
crate-type = ["rlib"]

[dependencies]
graphreact-engine-zig = { path = "../graphreact-engine-zig" }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
parking_lot.workspace = true
rustc-hash.workspace = true

[build-dependencies]
cc.workspace = true

[lints]
workspace = true
