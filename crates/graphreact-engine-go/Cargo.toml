[package]
name = "graphreact-engine-go"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Go runtime engine for GraphReact (M17). Loads cgo + c-shared artifacts produced by graphreact-codegen-go and dispatches against the graphreact-engine-zig Engine trait."

[lib]
crate-type = ["rlib"]

[dependencies]
graphreact-engine-zig = { path = "../graphreact-engine-zig" }
libloading = { workspace = true }
parking_lot.workspace = true
rustc-hash.workspace = true
dashmap.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# libc::_exit is the only safe watchdog escape for the 3f stress test:
# std::process::exit and std::process::abort both run destructors /
# pthread cleanup which themselves deadlock against a wedged Go
# runtime per golang/go#47100 (the same hazard ADR-0005 cites).
libc = "0.2"

[lints]
workspace = true
