[package]
name = "graphreact-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Standalone `grx` CLI — parses and runs `.grx` files. Engine selection (JSC / null / future) lives behind the graphreact-engine-zig trait."

[lib]
crate-type = ["rlib"]

[[bin]]
name = "grx"
path = "src/bin/grx.rs"

[dependencies]
graphreact-algorithms = { path = "../graphreact-algorithms" }
graphreact-core = { path = "../graphreact-core" }
graphreact-dist = { path = "../graphreact-dist" }
graphreact-codegen-go = { path = "../graphreact-codegen-go" }
graphreact-engine-cpython = { path = "../graphreact-engine-cpython" }
graphreact-engine-echo = { path = "../graphreact-engine-echo" }
graphreact-engine-go = { path = "../graphreact-engine-go" }
graphreact-engine-jsc = { path = "../graphreact-engine-jsc" }
graphreact-engine-null = { path = "../graphreact-engine-null" }
graphreact-engine-zig = { path = "../graphreact-engine-zig" }
graphreact-grx-parser = { path = "../graphreact-grx-parser" }
graphreact-hotreload = { path = "../graphreact-hotreload" }
graphreact-observer = { path = "../graphreact-observer" }
graphreact-secrets = { path = "../graphreact-secrets" }
clap.workspace = true
clap_complete.workspace = true
parking_lot.workspace = true
rustc-hash.workspace = true
rustls = { workspace = true, default-features = false, features = ["std", "ring"] }
rustls-native-certs.workspace = true
tokio-rustls = { workspace = true, default-features = false, features = ["ring"] }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["signal"] }
rand.workspace = true
notify = { workspace = true }
tracing.workspace = true
postcard.workspace = true
ratatui.workspace = true
crossterm.workspace = true
futures.workspace = true
tokio-tungstenite.workspace = true
# **M-Prod sub-track #3.** Zeroized no-echo stdin reader for
# `grx secrets set <NAME>`. Avoids hand-rolling the POSIX termios
# dance (which would need workspace `unsafe_code` exemption). Pure
# Rust, MIT/Apache-2.0, dependency-light.
rpassword = "7"

[features]
default = []
# **M16-Backend P10.** Pulls in the `graphreact-observer` crate's
# `otel` feature, which adds opentelemetry SDK deps and unlocks the
# `--observer-otel-endpoint` CLI flag + start_daemon's OtelSink
# construction. Default off so non-OTel users don't pay the OTel SDK
# dep cost (~30 transitive crates).
otel = ["graphreact-observer/otel"]

[dev-dependencies]
tempfile = "3"
clap_complete.workspace = true
rcgen.workspace = true
assert_cmd = "2"
# **M16-Backend P11.1.** Validates /v1/metrics output round-trips
# through the upstream Prometheus exposition parser (catches any
# encoder regression). Mirrors graphreact-observer's existing dev-dep.
prometheus-parse.workspace = true
# **M-Prod sub-track #2 Phase B Part 1.** Audit-event capture layer
# for the SIGHUP rotation tests (mirrors the graphreact-observer
# crate's existing tls_rotation test pattern). Registry + std only;
# no env-filter / fmt layer needed here.
tracing-subscriber = { workspace = true }
# **M-Prod sub-track #2 Phase B Part 1.** Subprocess SIGHUP test
# uses `libc::kill(pid, SIGHUP)` to drive a real signal at the
# spawned daemon. libc is already in the workspace's transitive
# graph (engine-cpython / engine-jsc / engine-go); declaring it
# as a CLI dev-dep documents the use site.
libc = "0.2"

[lints]
workspace = true
