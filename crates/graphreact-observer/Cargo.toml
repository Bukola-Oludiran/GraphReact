[package]
name = "graphreact-observer"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Observer + telemetry surfaces for GraphReact (Backend) — JSON logs, Prometheus, OTel, management API, ratatui terminal UI. Phase-1 substrate: TelemetrySink consumers + bench harness."

[lib]
crate-type = ["rlib"]

[dependencies]
graphreact-core = { path = "../graphreact-core" }
parking_lot.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
itoa.workspace = true

# M16-Backend P2 — Prometheus exporter + bind/auth/tls substrate.
dashmap.workspace = true
rustc-hash.workspace = true
zeroize.workspace = true
subtle.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
# M-Prod sub-track #2 Phase A — atomic-swap TLS rotation substrate.
# `arc-swap` is already pinned at workspace level (Cargo.toml:41).
# `RotatableServerConfig` wraps `ArcSwap<Arc<rustls::ServerConfig>>`
# so per-accept handshakes pick up the latest cert without tearing
# in-flight handshakes — each `acceptor.accept()` task owns its own
# `Arc<ServerConfig>` clone.
arc-swap.workspace = true
# `ring` is already in the dep tree via rustls's `ring` feature; the
# crate-local direct dep gives us `digest(SHA256, ...)` for the
# leaf-cert SHA-256 fingerprint emitted by the `tls_reloaded` audit
# event (matches `openssl x509 -fingerprint -sha256 -noout`). Pinned
# to the same major version rustls picks (0.17.x).
ring = "0.17"
# **M-Prod sub-track #1 Phase A.** Hash-chained tamper-evident
# audit-log SINK. The chain digest is SHA-256 over the canonical
# bytes of each `AuditRecord` (excluding the record's own
# `this_hash` field); `sha2` already ships at the workspace level
# (Cargo.toml:82) for the M14 wire-protocol hashes. Reusing it
# avoids pulling a second SHA-256 implementation.
sha2.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
bytes.workspace = true
thiserror.workspace = true

# M16-Backend P4 — Management API on axum.
axum.workspace = true
tower.workspace = true
tower-http.workspace = true

# **M-Prod sub-track #6 Phase A.** Per-IP rate limiter for the
# protected `/v1/*` routes. `tower_governor 0.5.x` is the latest
# release compatible with our `axum 0.7` pin (0.6+ require axum
# 0.8 — a separate, larger migration involving handler signatures
# + extractor changes). When the workspace migrates to axum 0.8,
# this pin MUST bump in lockstep — flag it on the axum-bump
# tracking issue. `axum` feature wires `PeerIpKeyExtractor` to read
# `ConnectInfo<SocketAddr>` from request extensions; the
# `accept_loop` inserts that extension per accept so the extractor
# never falls back to `UnableToExtractKey`. `tracing` feature is
# intentionally OFF so the layer's own events don't bypass the
# single canonical `target = "graphreact::observer::audit"` sink
# — the `error_handler` closure rolls the audit event itself.
tower_governor = { version = "0.5", default-features = false, features = ["axum"] }

# M-Ingress phase 2 — UUIDv4 correlation_id mint for `POST /v1/nodes/:id/call`.
uuid.workspace = true

# **M-Prod sub-track #1 Phase B Part 2 (Group 1c).** JWT-OIDC bridge.
# `jsonwebtoken 9` exposes:
#   - `decode_header` (per-request) + `decode<Claims>` (per-request)
#   - `Validation` (algorithm whitelist + iss/aud/exp/nbf/leeway)
#   - `jwk::JwkSet` + `Jwk` + `DecodingKey::from_jwk` (per-rotation)
# Default features ON (keeps `use_pem` for ASN.1 path on RSA keys).
# License MIT — accepted by the existing cargo-deny allowlist.
jsonwebtoken = { workspace = true }

# M16-Backend P7 — WebSocket + SSE live event stream.
futures.workspace = true

# M16-Backend P10 — OpenTelemetry traces (feature-gated). Default off
# so non-OTel users don't pay the dep cost. The `otel` feature unlocks
# `OtelSink: TelemetrySink` which exports spans via OTLP/gRPC to a
# stock OTel collector (Tempo/Jaeger/Honeycomb/etc.). Cross-node span
# links propagate via the M14 wire format's `trace_context` field
# (`OBSERVER_OTEL_V1` capability + `WIRE_VERSION = 3`).
#
# `graphreact-dist` is a dep ONLY under `otel` because OtelSink
# implements `graphreact_dist::WireTracingHook` (the trait lives in
# dist where capability negotiation + wire serialization happens; the
# impl lives here where OTel SpanContext extraction happens). Default
# observer builds don't pull dist (or any of its M14 dep tree).
opentelemetry = { version = "0.31", optional = true }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio", "trace"], optional = true }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["trace", "grpc-tonic"], optional = true }
graphreact-dist = { path = "../graphreact-dist", optional = true }

[features]
default = []
# **M16-Backend P10.** OpenTelemetry traces via OTLP/gRPC. See
# `docs/backend/m16-otel.md` for the span shape + cross-node link
# protocol.
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:graphreact-dist",
]
# **M16-Backend P10.** Enables `opentelemetry_sdk`'s `testing` feature
# so headless tests can drive `InMemorySpanExporter` for span-shape
# pinning. Implies `otel`. Used as `cargo test -p graphreact-observer
# --features otel-test`.
otel-test = ["otel", "opentelemetry_sdk?/testing"]

[dev-dependencies]
graphreact-core = { path = "../graphreact-core" }
criterion.workspace = true
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
parking_lot.workspace = true
serde_json.workspace = true
prometheus-parse.workspace = true
rcgen.workspace = true
tokio-tungstenite = { workspace = true, default-features = false, features = ["connect", "handshake"] }
# M-Prod #1 Phase A — audit-chain mode-0600 tests + audit_chain_e2e
# integration tests both want a per-test scratch directory; tempfile
# is the workspace-light option vs the heavier sibling tempdir crate.
tempfile = "3"

[[bench]]
name = "scheduler_overhead"
harness = false

[lints]
workspace = true
